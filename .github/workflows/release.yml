name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      -
        name: Release-Please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          command: manifest
          default-branch: main
          package-name: ha_disk_monitor
          bump-minor-pre-major: true
          bump-patch-for-minor-pre-major: true

      - name: "Checkout the repository"
        uses: "actions/checkout@v6.0.2"
        with:
          fetch-depth: 0
        if: ${{ steps.release.outputs.release_created }}

      - name: 'Get Previous tag'
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
        if: ${{ steps.release.outputs.release_created }}

      - name: Patch manifest and zip
        run: |
          VERSION="${{ steps.previoustag.outputs.tag }}"
          VERSION=${VERSION#v}
          echo "Updating manifest.json with version: $VERSION"
          yq -i -o json '.version="'$VERSION'"' \
            "${{ github.workspace }}/custom_components/ha_disk_monitor/manifest.json"
          cat "${{ github.workspace }}/custom_components/ha_disk_monitor/manifest.json"
        if: ${{ steps.release.outputs.release_created }}

      - name: "Archiving the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/ha_disk_monitor"
          zip ha_disk_monitor.zip -r ./
        if: ${{ steps.release.outputs.release_created }}

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ github.workspace }}/custom_components/ha_disk_monitor/ha_disk_monitor.zip
          tag_name: ${{ steps.previoustag.outputs.tag }}
        if: ${{ steps.release.outputs.release_created }}
